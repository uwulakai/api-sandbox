[project]
name = "api-sandbox-backend"
version = "0.1.0"
description = "Backend API for the API Sandbox mock server platform"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "pydantic-settings>=2.8,<3.0",
    "email-validator>=2.2,<3.0",
    "sqlmodel>=0.0.24,<1.0",
    "asyncpg>=0.30,<1.0",
    "aiosqlite>=0.20,<1.0",
    "alembic>=1.14,<2.0",
    "bcrypt>=4.3,<5.0",
    "docker>=7.1,<8.0",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.test.dependencies]
pytest = ">=8.3,<9.0"
pytest-asyncio = ">=0.25,<1.0"
httpx = ">=0.28,<1.0"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
