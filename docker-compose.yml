services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-16-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DB_NAME:-api_sandbox}
      POSTGRES_USER: ${POSTGRES_USER:-api_sandbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-api_sandbox}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      # Authenticate over the same network route as the application. Loopback
      # connections can use trust and would miss a stale password in the volume.
      test: ["CMD-SHELL", "PGPASSWORD=\"$${POSTGRES_PASSWORD}\" psql -h postgres -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -Atqc 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10

  db_init:
    build:
      context: ./backend
    command: ["python", "-m", "app.core.bootstrap"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-api_sandbox}:${POSTGRES_PASSWORD:-api_sandbox}@postgres:5432/${POSTGRES_DB_NAME:-api_sandbox}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network
    restart: "no"

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-api_sandbox}:${POSTGRES_PASSWORD:-api_sandbox}@postgres:5432/${POSTGRES_DB_NAME:-api_sandbox}
      MOCK_RUNTIME_IMAGE: ${MOCK_RUNTIME_IMAGE:-api-sandbox/mock-runtime:dev}
      MOCK_PUBLIC_BASE_URL: ${MOCK_PUBLIC_BASE_URL:-http://mock_gateway:8080}
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:-}
      SMTP_HOSTNAME: ${SMTP_HOSTNAME:-smtp.yandex.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-8}
      EMAIL_VERIFICATION_TTL_MINUTES: ${EMAIL_VERIFICATION_TTL_MINUTES:-30}
      EMAIL_VERIFICATION_RESEND_SECONDS: ${EMAIL_VERIFICATION_RESEND_SECONDS:-60}
    depends_on:
      postgres:
        condition: service_healthy
      db_init:
        condition: service_completed_successfully
    networks:
      - app_network
    expose:
      - "8000"
    labels:
      # Dokploy 0.29.x appends domain labels only to the list form.
      - "traefik.docker.network=${TRAEFIK_DOCKER_NETWORK:-dokploy-network}"
    restart: unless-stopped

  runtime_worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.runtime.worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-api_sandbox}:${POSTGRES_PASSWORD:-api_sandbox}@postgres:5432/${POSTGRES_DB_NAME:-api_sandbox}
      MOCK_RUNTIME_IMAGE: ${MOCK_RUNTIME_IMAGE:-api-sandbox/mock-runtime:dev}
      MOCK_NETWORK_NAME: ${COMPOSE_PROJECT_NAME}_mocks_network
      MOCK_PUBLIC_BASE_URL: ${MOCK_PUBLIC_BASE_URL:-http://mock_gateway:8080}
    depends_on:
      postgres:
        condition: service_healthy
      db_init:
        condition: service_completed_successfully
      mock_runtime_image:
        condition: service_completed_successfully
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - app_network
      - mocks_network
    stop_grace_period: 90s
    restart: unless-stopped

  mock_gateway:
    build:
      context: ./mock_gateway
    environment:
      MOCK_RUNTIME_PORT: ${MOCK_RUNTIME_PORT:-8080}
      MOCK_RUNTIME_CONTAINER_PREFIX: ${MOCK_RUNTIME_CONTAINER_PREFIX:-api-sandbox-mock-}
    networks:
      - mocks_network
      - public_network
    expose:
      - "8080"
    labels:
      - "traefik.docker.network=${TRAEFIK_DOCKER_NETWORK:-dokploy-network}"
    restart: unless-stopped

  mock_runtime_image:
    build:
      context: ./mock_runtime
    image: ${MOCK_RUNTIME_IMAGE:-api-sandbox/mock-runtime:dev}
    pull_policy: build
    command: ["true"]
    restart: "no"

  frontend:
    build:
      context: ./frontend
    environment:
      API_UPSTREAM: http://api:8000
      MOCK_GATEWAY_UPSTREAM: http://mock_gateway:8080
    depends_on:
      api:
        condition: service_started
      mock_gateway:
        condition: service_started
    networks:
      - app_network
      - public_network
    expose:
      - "8080"
    ports:
      - "127.0.0.1:${FRONTEND_HTTP_PORT:-8893}:8080"
    labels:
      - "traefik.docker.network=${TRAEFIK_DOCKER_NETWORK:-dokploy-network}"
    restart: unless-stopped

  autotests:
    build:
      context: .
      dockerfile: automation/Dockerfile
    environment:
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false -Duser.timezone=UTC
      TZ: UTC
      JENKINS_ADMIN_USER: ${JENKINS_ADMIN_USER:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?Set a Jenkins administrator password}
      API_BASE_URL: ${API_BASE_URL:-https://api.apisandbox.mnrg.tech}
      E2E_WAIT_SECONDS: ${E2E_WAIT_SECONDS:-90}
      E2E_CRON: ${E2E_CRON:-}
      E2E_OWNER_EMAIL: ${E2E_OWNER_EMAIL:-}
      E2E_OWNER_PASSWORD: ${E2E_OWNER_PASSWORD:-}
      E2E_OTHER_EMAIL: ${E2E_OTHER_EMAIL:-}
      E2E_OTHER_PASSWORD: ${E2E_OTHER_PASSWORD:-}
    volumes:
      - jenkins_data:/var/jenkins_home
    expose:
      - "8080"
    labels:
      - "traefik.docker.network=${TRAEFIK_DOCKER_NETWORK:-dokploy-network}"
    restart: unless-stopped
    stop_grace_period: 3m
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/login"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

volumes:
  postgres_data:
  jenkins_data:

networks:
  app_network:
  mocks_network:
    # The worker uses this name when creating mock containers on the same host.
    name: ${COMPOSE_PROJECT_NAME}_mocks_network
    driver: bridge
  public_network:
    name: ${PUBLIC_NETWORK_NAME:-api-sandbox-public}
