[pytest]
testpaths = tests
addopts = -v --tb=short --maxfail=1 -p no:cacheprovider
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)s %(message)s
log_file_level = INFO
log_file_format = %(asctime)s %(levelname)s %(message)s
junit_suite_name = api_sandbox_live
junit_logging = all
markers =
    docker: optional read-only checks against the deployment Docker daemon
